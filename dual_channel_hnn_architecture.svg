<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc"><title id="title">DualChannelHNN architecture and training flow</title><desc id="desc">Cis and trans channels, bidirectional cross-attention, post-normalization and feed-forward blocks, beta and low-rank gamma decoding, prediction and training loop.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#526579"/></marker><style>.title{font:700 30px Arial;fill:#17324d}.sub{font:16px Arial;fill:#526579}.head{font:700 15px Arial;fill:#17324d}.body{font:13px Arial;fill:#526579}.lane{font:700 14px Arial}.node{stroke-width:2;rx:12;ry:12}.edge{fill:none;stroke:#526579;stroke-width:2;marker-end:url(#arrow)}.small{font:12px Arial;fill:#526579}</style></defs><rect width="1500" height="980" fill="#f7f9fc"/><text x="750" y="48" text-anchor="middle" class="title">DualChannelHNN: architecture and training flow</text><text x="750" y="78" text-anchor="middle" class="sub">Cis/trans representations -&gt; bidirectional cross-attention -&gt; low-rank interaction -&gt; phenotype</text><text x="35" y="130" class="lane" fill="#3982b8">CIS CHANNEL</text><text x="35" y="435" class="lane" fill="#41966a">TRANS CHANNEL</text>
<rect x="35" y="155" width="145" height="78" class="node" fill="#dceeff" stroke="#3982b8"/><text x="107" y="185" text-anchor="middle" class="head">Cis genotypes</text><text x="107" y="210" text-anchor="middle" class="body">X_cis (B, n_cis)</text><rect x="215" y="155" width="180" height="78" class="node" fill="#dceeff" stroke="#3982b8"/><text x="305" y="185" text-anchor="middle" class="head">Bidirectional GRU</text><text x="305" y="210" text-anchor="middle" class="body">width = 2h</text><path d="M180 194 H215" class="edge"/>
<rect x="35" y="460" width="145" height="90" class="node" fill="#e1f4ea" stroke="#41966a"/><text x="107" y="490" text-anchor="middle" class="head">Trans inputs</text><text x="107" y="515" text-anchor="middle" class="body">X_trans + signed</text><text x="107" y="535" text-anchor="middle" class="body">position + module ID</text><rect x="215" y="460" width="180" height="90" class="node" fill="#e1f4ea" stroke="#41966a"/><text x="305" y="490" text-anchor="middle" class="head">Linear embedding</text><text x="305" y="515" text-anchor="middle" class="body">concat features, ReLU</text><text x="305" y="535" text-anchor="middle" class="body">output width 2h</text><rect x="430" y="460" width="195" height="90" class="node" fill="#e1f4ea" stroke="#41966a"/><text x="527" y="490" text-anchor="middle" class="head">Graph convolution x L</text><text x="527" y="515" text-anchor="middle" class="body">A_norm neighbor + self path</text><text x="527" y="535" text-anchor="middle" class="body">ReLU + LayerNorm</text><path d="M180 505 H215" class="edge"/><path d="M395 505 H430" class="edge"/>
<rect x="675" y="285" width="220" height="155" class="node" fill="#eee6fb" stroke="#8064b2"/><text x="785" y="325" text-anchor="middle" class="head">Bidirectional</text><text x="785" y="350" text-anchor="middle" class="head">cross-attention</text><text x="785" y="385" text-anchor="middle" class="body">cis queries trans K/V</text><text x="785" y="410" text-anchor="middle" class="body">trans queries cis K/V</text><path d="M395 194 C520 194 560 300 675 325" class="edge"/><path d="M625 505 C650 505 640 415 675 400" class="edge"/>
<rect x="960" y="170" width="205" height="115" class="node" fill="#dceeff" stroke="#3982b8"/><text x="1062" y="198" text-anchor="middle" class="head">Cis post-attention</text><text x="1062" y="224" text-anchor="middle" class="body">residual + LayerNorm</text><text x="1062" y="246" text-anchor="middle" class="body">FFN (2h -&gt; 8h -&gt; 2h)</text><text x="1062" y="268" text-anchor="middle" class="body">residual + LayerNorm</text><rect x="960" y="445" width="205" height="115" class="node" fill="#e1f4ea" stroke="#41966a"/><text x="1062" y="473" text-anchor="middle" class="head">Trans post-attention</text><text x="1062" y="499" text-anchor="middle" class="body">residual + LayerNorm</text><text x="1062" y="521" text-anchor="middle" class="body">FFN (2h -&gt; 8h -&gt; 2h)</text><text x="1062" y="543" text-anchor="middle" class="body">residual + LayerNorm</text><path d="M895 325 C925 325 925 230 960 230" class="edge"/><path d="M895 400 C925 400 925 500 960 500" class="edge"/>
<rect x="1210" y="150" width="150" height="70" class="node" fill="#dceeff" stroke="#3982b8"/><text x="1285" y="178" text-anchor="middle" class="head">Cis beta head</text><text x="1285" y="201" text-anchor="middle" class="body">beta (B, n_cis)</text><rect x="1210" y="245" width="150" height="70" class="node" fill="#eee6fb" stroke="#8064b2"/><text x="1285" y="273" text-anchor="middle" class="head">Cis z head</text><text x="1285" y="296" text-anchor="middle" class="body">z (B, n_cis, r)</text><rect x="1210" y="475" width="150" height="70" class="node" fill="#e1f4ea" stroke="#41966a"/><text x="1285" y="503" text-anchor="middle" class="head">Trans w head</text><text x="1285" y="526" text-anchor="middle" class="body">w (B, n_trans, r)</text><path d="M1165 210 H1210" class="edge"/><path d="M1165 230 C1185 230 1185 280 1210 280" class="edge"/><path d="M1165 500 H1210" class="edge"/>
<rect x="1385" y="300" width="95" height="105" class="node" fill="#fff0dc" stroke="#d28b2e"/><text x="1432" y="332" text-anchor="middle" class="head">Gains</text><text x="1432" y="357" text-anchor="middle" class="body">beta, z, w</text><text x="1432" y="381" text-anchor="middle" class="small">calibrated</text><path d="M1360 280 C1370 280 1370 330 1385 330" class="edge"/><path d="M1360 510 C1380 510 1370 390 1385 390" class="edge"/>
<rect x="1210" y="365" width="150" height="78" class="node" fill="#eee6fb" stroke="#8064b2"/><text x="1285" y="395" text-anchor="middle" class="head">Low-rank gamma</text><text x="1285" y="421" text-anchor="middle" class="body">sum_r z * w</text><path d="M1285 315 V365" class="edge"/><path d="M1385 355 H1360" class="edge"/>
<rect x="1385" y="605" width="95" height="92" class="node" fill="#fff0dc" stroke="#d28b2e"/><text x="1432" y="635" text-anchor="middle" class="head">Prediction</text><text x="1432" y="660" text-anchor="middle" class="small">mu + Xc beta</text><text x="1432" y="680" text-anchor="middle" class="small">+ Xc gamma Xt</text><path d="M1360 404 C1410 450 1430 520 1432 605" class="edge"/><path d="M1360 185 C1430 260 1450 450 1432 605" class="edge"/><text x="1432" y="720" text-anchor="middle" class="head">y_hat</text>
<line x1="35" y1="755" x2="1480" y2="755" stroke="#c8d2dc" stroke-width="2"/><text x="35" y="785" class="lane" fill="#17324d">TRAINING LOOP</text>
<rect x="35" y="810" width="205" height="92" class="node" fill="#fff" stroke="#8093a5"/><text x="137" y="840" text-anchor="middle" class="head">Simulate data</text><text x="137" y="866" text-anchor="middle" class="body">cis LD; trans clusters;</text><text x="137" y="887" text-anchor="middle" class="body">phenotype from beta/gamma</text><rect x="275" y="810" width="205" height="92" class="node" fill="#fff" stroke="#8093a5"/><text x="377" y="840" text-anchor="middle" class="head">Train/test split</text><text x="377" y="866" text-anchor="middle" class="body">80/20; mini-batches</text><text x="377" y="887" text-anchor="middle" class="body">batch size 128</text><rect x="515" y="810" width="205" height="92" class="node" fill="#fff" stroke="#8093a5"/><text x="617" y="840" text-anchor="middle" class="head">Forward pass</text><text x="617" y="866" text-anchor="middle" class="body">y_hat, beta, z, w, gamma</text><text x="617" y="887" text-anchor="middle" class="body">current parameters</text><rect x="755" y="810" width="245" height="92" class="node" fill="#fff" stroke="#8093a5"/><text x="877" y="840" text-anchor="middle" class="head">Composite loss</text><text x="877" y="866" text-anchor="middle" class="body">MSE + scale/shape/radial</text><text x="877" y="887" text-anchor="middle" class="body">+ factor independence</text><rect x="1035" y="810" width="190" height="92" class="node" fill="#fff" stroke="#8093a5"/><text x="1130" y="840" text-anchor="middle" class="head">Optimize</text><text x="1130" y="866" text-anchor="middle" class="body">Adam; grad clipping</text><text x="1130" y="887" text-anchor="middle" class="body">staged loss schedule</text><rect x="1260" y="810" width="220" height="92" class="node" fill="#fff" stroke="#8093a5"/><text x="1370" y="840" text-anchor="middle" class="head">Held-out checks</text><text x="1370" y="866" text-anchor="middle" class="body">R2, gamma corr/scale</text><text x="1370" y="887" text-anchor="middle" class="body">cis beta / radial rank</text><path d="M240 856 H275" class="edge"/><path d="M480 856 H515" class="edge"/><path d="M720 856 H755" class="edge"/><path d="M1000 856 H1035" class="edge"/><path d="M1225 856 H1260" class="edge"/><text x="750" y="940" text-anchor="middle" class="small">Loss schedule: epochs 0-29 MSE + scale anchors; 30-99 add weak shape/radial terms; 100+ full regularization; amplitude-prior parameters frozen.</text></svg>